version: "2"
sql:
  - engine: "postgresql"
    # A clean, sqlc-friendly schema (mirror of migrations/000001_init.up.sql
    # without trigger/DO blocks that the type checker does not need).
    schema: "sql/schema.sql"
    queries: "sql/queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "string"
